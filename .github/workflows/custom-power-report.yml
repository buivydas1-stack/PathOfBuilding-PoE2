name: Custom Power Report checks
on:
  push:
    branches: [codex/pob2-customizations]
  pull_request:
    branches: [codex/pob2-customizations]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  functional:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test with the upstream Windows LuaJIT runtime
        shell: powershell
        run: ./tools/Test-CustomPowerReport.ps1
